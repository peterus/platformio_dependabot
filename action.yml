name: 'PlatformIO Dependabot'
description: 'a Dependabot like script for PlatformIO'
inputs:
  github_token:
    description: 'Github Token'
    required: true
  assignee:
    description: 'Who to assign the pull request'
    required: false
  project_path:
    description: 'Path to the PlatformIO project (directory containing platformio.ini), relative to the repository root. Default: repository root'
    required: false
runs:
  using: 'docker'
  image: 'Dockerfile'
  entrypoint: "/app/entrypoint.sh"
